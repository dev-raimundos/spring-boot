spring.application.name=api

spring.modulith.detection-strategy=explicitly-annotated

server.forward-headers-strategy=native

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=${DATABASE_AUTO_MIGRATE:false}
spring.flyway.schemas=users

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:coeur-api}
app.jwt.audience=${JWT_AUDIENCE:coeur-api}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

app.cookie.domain=${COOKIE_DOMAIN:}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
